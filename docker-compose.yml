services:
  db:
    image: postgres:16-alpine
    container_name: tradertrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradertrack}
      POSTGRES_USER: ${POSTGRES_USER:-tradertrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradertrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradertrack} -d ${POSTGRES_DB:-tradertrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradertrack-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,.onrender.com,${LAN_HOST:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # Backend code is copied into the image, so rebuild when it changes.
        - action: rebuild
          path: ./config
        - action: rebuild
          path: ./core
        - action: rebuild
          path: ./users
        - action: rebuild
          path: ./manage.py
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./entrypoint.sh

  frontend:
    build:
      context: ../tradetrack-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_MOCK: "false"
    container_name: tradertrack-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    develop:
      watch:
        # The production-style frontend image contains a compiled Vite bundle,
        # so source changes need an image rebuild before Nginx can serve them.
        - action: rebuild
          path: ../tradetrack-frontend/src
        - action: rebuild
          path: ../tradetrack-frontend/public
        - action: rebuild
          path: ../tradetrack-frontend/index.html
        - action: rebuild
          path: ../tradetrack-frontend/package.json
        - action: rebuild
          path: ../tradetrack-frontend/package-lock.json
        - action: rebuild
          path: ../tradetrack-frontend/vite.config.js
        - action: rebuild
          path: ../tradetrack-frontend/tailwind.config.js
        - action: rebuild
          path: ../tradetrack-frontend/postcss.config.js

volumes:
  postgres_data:
